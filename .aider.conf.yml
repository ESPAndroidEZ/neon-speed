# Aider config for the local Qwen server (llama.cpp on 127.0.0.1:8080).
# Env needed: OPENAI_API_BASE=http://127.0.0.1:8080/v1  OPENAI_API_KEY=local-dummy-key
model: openai/qwen-27b
edit-format: diff
map-tokens: 1024

# Always-in-context, read-only: kept small on purpose.
read:
  - AGENTS.md
  - src/types/game.ts

# Run the real build after every edit and let Qwen fix failures itself.
test-cmd: npm run build
auto-test: true
auto-lint: false

auto-commits: true
gitignore: false
analytics-disable: true
check-update: false
show-model-warnings: false
suggest-shell-commands: false
