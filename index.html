<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#05060d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Neon Speed" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="./icons/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/favicon-car-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icons/favicon-car-512.png" />
    <title>Neon Speed</title>
    <style>
      :root {
        --safe-t: env(safe-area-inset-top, 0px);
        --safe-r: env(safe-area-inset-right, 0px);
        --safe-b: env(safe-area-inset-bottom, 0px);
        --safe-l: env(safe-area-inset-left, 0px);
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: var(--app-h, 100vh);
        height: 100dvh;
        background: #05060d;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        position: fixed;
        inset: 0;
      }
      /* a game, not a web page: a long press never selects text, opens the callout or magnifies a button (menus sit outside #app) */
      body,
      body * {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      input,
      textarea {
        -webkit-user-select: text;
        user-select: text;
      }
      button,
      [role='button'],
      .rb-btn,
      .rb-card {
        touch-action: manipulation;
      }
      #app {
        position: fixed;
        inset: 0;
        width: 100vw;
        width: 100dvw;
        height: var(--app-h, 100vh);
        height: 100dvh;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #app canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        touch-action: none;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #05060d;
        color: #e8f6ff;
        font: 900 italic clamp(28px, 7vmin, 64px) system-ui, sans-serif;
        letter-spacing: 0.06em;
        transition: opacity 0.35s;
      }
      #boot .wm em { font-style: italic; color: #d8f8ff; text-shadow: 0 0 10px #18d8ff, 0 0 32px #18d8ff, 0 0 60px #18d8ff88; }
      #boot .wm strong { font-weight: 900; color: #ffe0f0; text-shadow: 0 0 10px #ff2a9d, 0 0 32px #ff2a9d, 0 0 60px #ff2a9d88; }
      #boot b {
        display: block;
        width: min(60vw, 320px);
        height: 6px;
        border-radius: 3px;
        background: #ffffff22;
        overflow: hidden;
      }
      #boot i {
        display: block;
        height: 100%;
        width: 8%;
        background: linear-gradient(90deg, #18d8ff, #ff2a9d);
        transition: width 0.3s;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot" data-offscreen-ok><span class="wm"><em>NEON</em> <strong>SPEED</strong></span><b><i></i></b></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
